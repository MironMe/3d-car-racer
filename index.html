<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift Racer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050915;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#000814, #02050b);
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
    }

    .hud h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 2px;
      color: #7ef9ff;
    }

    .hud .stats {
      font-size: 15px;
      line-height: 1.6;
    }

    .start-screen, .game-over {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 20;
    }

    .panel {
      width: min(88vw, 500px);
      background: rgba(10, 16, 29, 0.95);
      border: 2px solid rgba(126, 249, 255, 0.7);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 0 25px rgba(126, 249, 255, 0.25);
    }

    .panel h1 {
      margin: 0 0 14px;
      color: #7ef9ff;
      font-size: clamp(28px, 5vw, 48px);
      text-shadow: 0 0 18px rgba(126,249,255,0.7);
    }

    .panel p {
      margin: 7px 0;
      line-height: 1.7;
      color: #dfeef7;
      font-size: 16px;
    }

    .start-btn {
      margin-top: 18px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d4ff, #4f63ff);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(79, 99, 255, 0.5);
    }

    .game-over {
      display: none;
    }

    .game-over.show {
      display: flex;
    }

    .game-over .panel {
      border-color: rgba(255, 89, 128, 0.8);
      box-shadow: 0 0 25px rgba(255, 89, 128, 0.25);
    }

    .game-over h1 {
      color: #ff6b89;
      text-shadow: 0 0 18px rgba(255,107,137,0.7);
    }
  </style>
</head>
<body>
  <div class="hud">
    <h2>NEON RACE</h2>
    <div class="stats">
      <div>Speed: <span id="speed">0</span> km/h</div>
      <div>Distance: <span id="distance">0</span> m</div>
      <div>Best: <span id="best">0</span> m</div>
    </div>
  </div>

  <div class="start-screen" id="startScreen">
    <div class="panel">
      <h1>NEON RACE</h1>
      <p>Use A/D or left/right to move.</p>
      <p>Use W/↑ to accelerate a little or S/↓ to brake.</p>
      <p>Avoid traffic and survive as long as possible.</p>
      <button class="start-btn" id="startBtn">Start Race</button>
    </div>
  </div>

  <div class="game-over" id="gameOver">
    <div class="panel">
      <h1>CRASH!</h1>
      <p id="finalScore">Distance: 0 m</p>
      <button class="start-btn" id="restartBtn">Race Again</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const speedEl = document.getElementById("speed");
    const distanceEl = document.getElementById("distance");
    const bestEl = document.getElementById("best");
    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const gameOver = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");

    let state = "menu";
    let bestDistance = 0;
    let lastTime = 0;

    const keys = {
      left: false,
      right: false,
      up: false,
      down: false
    };

    const road = {
      width: 360,
      x: 0,
      scroll: 0,
      laneCount: 3
    };

    const player = {
      lane: 1,
      x: 0,
      y: 0,
      width: 56,
      height: 98,
      speed: 0,
      color: "#5ae7ff",
      maxSpeed: 300,
      accel: 120,
      brake: 220
    };

    let traffic = [];
    let roadParticles = [];
    let distance = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      road.x = (window.innerWidth - road.width) / 2;
      player.y = window.innerHeight - 140;
    }

    function laneToX(lane) {
      const laneWidth = road.width / road.laneCount;
      return road.x + laneWidth * (lane + 0.5);
    }

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function resetGame() {
      player.lane = 1;
      player.speed = 0;
      distance = 0;
      road.scroll = 0;
      traffic = [];
      roadParticles = [];

      for (let i = 0; i < 10; i++) {
        spawnTraffic(i * 240);
      }

      player.x = laneToX(player.lane);
      bestEl.textContent = Math.floor(bestDistance);
      speedEl.textContent = "0";
      distanceEl.textContent = "0";
    }

    function createTrafficCar(offset = 0) {
      const lane = Math.floor(Math.random() * road.laneCount);
      const colorPool = ["#ff5c7a", "#ffd166", "#6ef7a0", "#d39cff"];
      return {
        lane,
        x: laneToX(lane),
        y: -200 - offset,
        width: 52,
        height: 92,
        color: colorPool[Math.floor(Math.random() * colorPool.length)],
        speed: 150 + Math.random() * 140
      };
    }

    function spawnTraffic(offset = 0) {
      traffic.push(createTrafficCar(offset));
    }

    function startGame() {
      resetGame();
      state = "running";
      startScreen.style.display = "none";
      gameOver.classList.remove("show");
    }

    function endGame() {
      state = "gameover";
      bestDistance = Math.max(bestDistance, distance);
      bestEl.textContent = Math.floor(bestDistance);
      finalScore.textContent = "Distance: " + Math.floor(distance) + " m";
      gameOver.classList.add("show");
    }

    function updateInput() {
      if (state !== "running") return;

      if (keys.left) player.lane -= 0.14;
      if (keys.right) player.lane += 0.14;

      player.lane = clamp(player.lane, 0, road.laneCount - 1);

      if (keys.up) player.speed += player.accel * 0.9;
      if (keys.down) player.speed -= player.brake * 0.9;

      player.speed -= 30;
      player.speed = clamp(player.speed, 0, player.maxSpeed);

      const targetX = laneToX(player.lane);
      player.x += (targetX - player.x) * 0.18;
    }

    function updateRoadParticles() {
      if (Math.random() < 0.8) {
        roadParticles.push({
          x: road.x + Math.random() * road.width,
          y: -20,
          size: 2 + Math.random() * 4,
          speed: 180 + Math.random() * 220
        });
      }

      for (const p of roadParticles) {
        p.y += p.speed * (player.speed / 220 + 0.5) * 0.016;
      }

      roadParticles = roadParticles.filter(p => p.y < window.innerHeight + 20);
    }

    function updateTraffic(dt) {
      for (const car of traffic) {
        car.y += (player.speed * 0.9 + car.speed) * dt;
      }

      traffic = traffic.filter(car => car.y < window.innerHeight + 120);

      while (traffic.length < 12) {
        spawnTraffic(Math.random() * 500);
      }

      for (const car of traffic) {
        const hitX = Math.abs(car.x - player.x) < (car.width + player.width) * 0.5;
        const hitY = Math.abs(car.y - player.y) < (car.height + player.height) * 0.5;

        if (hitX && hitY) {
          endGame();
        }
      }
    }

    function update(dt) {
      if (state !== "running") return;

      updateInput();
      road.scroll += player.speed * dt;

      distance += player.speed * dt * 0.75;
      bestDistance = Math.max(bestDistance, distance);

      speedEl.textContent = Math.floor(player.speed * 1.2);
      distanceEl.textContent = Math.floor(distance);
      bestEl.textContent = Math.floor(bestDistance);

      updateRoadParticles();
      updateTraffic(dt);
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#071526");
      grad.addColorStop(0.5, "#0b1732");
      grad.addColorStop(1, "#04070d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // glow
      const glow = ctx.createRadialGradient(
        canvas.width / 2, canvas.height * 0.2, 10,
        canvas.width / 2, canvas.height * 0.2, canvas.width * 0.7
      );
      glow.addColorStop(0, "rgba(70, 120, 255, 0.22)");
      glow.addColorStop(1, "rgba(70, 120, 255, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawRoad() {
      ctx.fillStyle = "#1a2234";
      ctx.fillRect(road.x, 0, road.width, canvas.height);

      // road stripes
      for (let i = 0; i < 30; i++) {
        const y = ((road.scroll + i * 90) % (canvas.height + 90)) - 90;
        ctx.fillStyle = "#edf3ff";
        ctx.fillRect(road.x + road.width / 3 - 6, y, 12, 60);
        ctx.fillRect(road.x + (road.width * 2 / 3) - 6, y, 12, 60);
      }

      // borders
      ctx.strokeStyle = "rgba(123, 247, 255, 0.7)";
      ctx.lineWidth = 3;
      ctx.strokeRect(road.x, 0, road.width, canvas.height);

      // side glow
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(road.x - 14, 0, 14, canvas.height);
      ctx.fillRect(road.x + road.width, 0, 14, canvas.height);
    }

    function drawRoadParticles() {
      for (const p of roadParticles) {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(p.x, p.y, p.size, p.size * 2.5);
      }
    }

    function drawCar(x, y, width, height, color) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(-width * 0.5 + 7, height * 0.08, width - 14, height * 0.72);

      ctx.fillStyle = color;
      ctx.fillRect(-width * 0.5, 0, width, height);

      ctx.fillStyle = "rgba(199, 241, 255, 0.9)";
      ctx.fillRect(-width * 0.28, 12, width * 0.56, height * 0.24);

      ctx.fillStyle = "#111821";
      ctx.fillRect(-width * 0.38, 8, 12, 22);
      ctx.fillRect(width * 0.26, 8, 12, 22);
      ctx.fillRect(-width * 0.38, height - 30, 12, 22);
      ctx.fillRect(width * 0.26, height - 30, 12, 22);

      ctx.restore();
    }

    function drawPlayer() {
      drawCar(player.x, player.y, player.width, player.height, player.color);
    }

    function drawTraffic() {
      for (const car of traffic) {
        drawCar(car.x, car.y, car.width, car.height, car.color);
      }
    }

    function draw() {
      drawBackground();
      drawRoad();
      drawRoadParticles();
      drawTraffic();
      drawPlayer();
    }

    function tick(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(tick);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "a" || event.key === "ArrowLeft") keys.left = true;
      if (key === "d" || event.key === "ArrowRight") keys.right = true;
      if (key === "w" || event.key === "ArrowUp") keys.up = true;
      if (key === "s" || event.key === "ArrowDown") keys.down = true;
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "a" || event.key === "ArrowLeft") keys.left = false;
      if (key === "d" || event.key === "ArrowRight") keys.right = false;
      if (key === "w" || event.key === "ArrowUp") keys.up = false;
      if (key === "s" || event.key === "ArrowDown") keys.down = false;
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    window.addEventListener("resize", resizeCanvas);

    function init() {
      resizeCanvas();
      resetGame();
      requestAnimationFrame(tick);
    }

    init();
  </script>
</body>
</html>
